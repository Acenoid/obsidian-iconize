name: Release

# Builds a release draft when a version tag is pushed, e.g. 2.16.0 or
# 2.16.0-beta.1. Pushes to branches, other tags, moved or deleted tags and
# copies of this repository never start it, and it has no manual trigger.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Installs the dependencies and runs their code, so it may only read.
  build:
    if: github.repository == 'Acenoid/obsidian-iconize' && github.event.created
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # The git hooks are only needed for local commits.
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag
        run: |
          num='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^$num\.$num\.$num(-beta\.$num)?$ ]]; then
            echo "::error::$TAG is not a version like 2.16.0 or 2.16.0-beta.1."
            exit 1
          fi

          version=$(jq -r .version manifest.json)
          if [ "$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG, but manifest.json has version $version."
            exit 1
          fi

          # Final versions come from main or their maintenance line,
          # test versions from any branch on GitHub.
          branches=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:short)')
          if [[ "$TAG" != *-* ]]; then
            line="release/v$(cut -d. -f1,2 <<< "$TAG")"
            branches=$(grep -Fx -e origin/main -e "origin/$line" <<< "$branches" || true)
          fi
          if [ -z "$branches" ]; then
            echo "::error::The commit of $TAG is on no branch a release may come from."
            exit 1
          fi
          echo "Building $TAG from $GITHUB_SHA on: $branches"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-workspace.yaml and the lockfile need pnpm 12.
          version: 12
          run_install: false

      # No dependency cache, so a release never uses files from other runs.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Build
        run: |
          echo "export const obsidianExportPath = './dist';" > env.js
          pnpm build
          cmp manifest.json dist/manifest.json
          ls -l dist

      - name: Upload plugin files
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 7

  # Runs no code from the repository or its dependencies.
  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check that no release exists
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -Fxq "$TAG" <<< "$tags"; then
            echo "::error::A release or release draft for $TAG already exists."
            exit 1
          fi

      - name: Download plugin files
        uses: actions/download-artifact@v8
        with:
          name: plugin
          path: dist

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release draft
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$TAG" --notes "" "${flags[@]}" \
            dist/main.js dist/manifest.json dist/styles.css
